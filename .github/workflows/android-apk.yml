name: MAD 1.0 - APK autonomo Android
on:
  push:
    branches: [main, feature/mad-v1-starter]
  workflow_dispatch:
jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 65
    env:
      EXPO_PUBLIC_SUPABASE_URL: ${{ secrets.EXPO_PUBLIC_SUPABASE_URL }}
      EXPO_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.EXPO_PUBLIC_SUPABASE_PUBLISHABLE_KEY }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install dependencies
        run: |
          npm install --no-audit --no-fund
          npx expo install --fix --npm
      - name: TypeScript check
        run: npx tsc --noEmit
      - name: Generate Android native project
        run: npx expo prebuild --platform android --clean --non-interactive
      - name: Build standalone RELEASE APK with embedded JS
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon
      - name: Prepare installable APK
        run: |
          mkdir -p output
          cp android/app/build/outputs/apk/release/app-release.apk output/MAD-v1.0.apk
          test -s output/MAD-v1.0.apk
          ls -lh output/MAD-v1.0.apk
      - name: Upload installable APK as ZIP
        uses: actions/upload-artifact@v4
        with:
          name: MAD-v1.0-Android-ZIP
          path: output/MAD-v1.0.apk
          if-no-files-found: error
          retention-days: 30
