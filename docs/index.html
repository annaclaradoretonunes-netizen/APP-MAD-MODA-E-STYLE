<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="referrer" content="no-referrer">
<title>Confirme seu e-mail | MAD Closet</title>
<style>
:root{font-family:Arial,Helvetica,sans-serif;color:#49343e;background:#fae9ee}
*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px}
main{background:#fffafc;max-width:440px;width:100%;border-radius:24px;padding:42px 28px;text-align:center;box-shadow:0 12px 40px #6a40501a}
.logo{font-size:42px;font-weight:750;letter-spacing:9px;margin:0}.closet{letter-spacing:5px;font-size:11px;margin:2px 0 12px}.tag{font-size:11px;letter-spacing:3px;margin:0 0 32px}
h1{font-size:25px;font-weight:600}p{line-height:1.6;color:#785f6b}
button,.link{display:block;width:100%;padding:15px;border:0;border-radius:12px;background:#503746;color:white;font-weight:700;font-size:15px;text-decoration:none;cursor:pointer;margin-top:24px}
button:disabled{opacity:.55;cursor:wait}.link{background:#f0dce4;color:#503746}small{color:#826f78}
</style>
</head>
<body>
<main>
<div class="logo">MAD</div><div class="closet">CLOSET</div><p class="tag">BE YOUR OWN MUSE.</p>
<h1 id="title">Confirme seu e-mail</h1>
<p id="description">Estamos quase lá! Toque no botão para confirmar seu endereço de e-mail e começar sua experiência no MAD Closet.</p>
<button id="confirm">Confirmar meu e-mail</button>
<a class="link" id="openApp" href="madcloset://" hidden>Abrir MAD Closet</a>
<p><small>Se você não criou uma conta, pode ignorar esta página.</small></p>
</main>
<script>
const SUPABASE_URL='https://ulkqtgozkiatuofanoeg.supabase.co';
const PUBLISHABLE_KEY='sb_publishable_TeSY54HO_7lNhIKAi6rnRw_9-0J2SAk';
const params=new URLSearchParams(location.search);
const token_hash=params.get('token_hash');
const type=params.get('type');
const button=document.getElementById('confirm');
const title=document.getElementById('title');
const description=document.getElementById('description');
if(!token_hash || type!=='email'){
 button.hidden=true;title.textContent='Link inválido';
 description.textContent='Abra o link de confirmação mais recente recebido no seu e-mail.';
}
button.addEventListener('click',async()=>{
 if(!token_hash || type!=='email')return;
 button.disabled=true;button.textContent='Confirmando...';
 try{
  const response=await fetch(SUPABASE_URL+'/auth/v1/verify',{
   method:'POST',
   headers:{'Content-Type':'application/json','apikey':PUBLISHABLE_KEY},
   body:JSON.stringify({token_hash,type:'email'})
  });
  if(!response.ok)throw new Error('Não foi possível confirmar. O link pode estar expirado ou já ter sido utilizado.');
  title.textContent='E-mail confirmado!';
  description.textContent='Sua conta foi confirmada com sucesso. Volte ao MAD Closet e faça login com seu e-mail e senha.';
  button.hidden=true;document.getElementById('openApp').hidden=false;
 }catch(error){
  description.textContent=error.message||'Ocorreu um erro. Solicite um novo e-mail de confirmação.';
  button.disabled=false;button.textContent='Tentar novamente';
 }
});
</script>
</body></html>
